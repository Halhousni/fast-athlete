services:
  signal-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped into the image so a running container names its commit.
        FAST_BUILD: ${FAST_BUILD:-local}
    container_name: signal-analyzer
    environment:
      # The cookie is Secure whenever this is 1, whatever scheme the container
      # sees behind the proxy.
      FAST_COOKIE_SECURE: ${FAST_COOKIE_SECURE:-0}
    # One channel peaks near 60 MB and eight near 450 MB in one process,
    # measured on the bundled 8-channel demo. 1 GB leaves room for the two
    # analyses the app allows to run at once.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Loopback by default. Docker's published ports bypass UFW, so binding
      # every interface exposes the app directly, around the proxy that
      # terminates TLS. Set FAST_BIND_IP in .env to publish elsewhere.
      - "${FAST_BIND_IP:-127.0.0.1}:8501:8501"
    volumes:
      - fast_data:/data
    restart: unless-stopped
volumes:
  fast_data: